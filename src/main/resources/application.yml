spring:
  application:
    name: Journey_Log_Backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.hibernate.SQL: INFO
    org.flywaydb: INFO

notion:
  api-base-url: https://api.notion.com/v1
  version: "2022-06-28"
  token: ${NOTION_TOKEN:}
  roadmap-database-id: ${NOTION_ROADMAP_DB_ID:}

velog:
  api-url: https://v2.velog.io/graphql
  username: ${VELOG_USERNAME:}
  page-size: 50
